spring.application.name=prg03victorthiago

# Banco de dados (antes ficava no persistence.xml)
spring.datasource.url=jdbc:mysql://localhost:3306/prg03_usuario?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=""
spring.datasource.password=""

# Hibernate s\u00f3 confere (quem cria as tabelas \u00e9 o Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# mant\u00e9m os nomes exatamente como as migrations criaram
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway: aplica db/migration antes do Hibernate subir (substitui o MigrationRunner)
spring.flyway.enabled=true

